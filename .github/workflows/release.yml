name: 编译并发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号(如 v1.0)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write 
jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      APP_NAME: ControlPanel
      SCCACHE_DIR: /home/runner/.cache/sccache
      RUSTC_WRAPPER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libx11-dev \
            libgl1-mesa-dev

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 配置 sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: 配置 Cargo 依赖缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deps-
      - name: 配置 sccache 编译产物缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ runner.os }}-sccache-${{ hashFiles('**/CMakeLists.txt', '**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sccache-${{ hashFiles('**/CMakeLists.txt', '**/Cargo.lock') }}-
            ${{ runner.os }}-sccache-

      - name: 编译
        env:
          SCCACHE_CACHE_SIZE: "2G"
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_PANIC: "abort"
          CARGO_PROFILE_RELEASE_STRIP: "true"
        run: |
          sccache --start-server
          sccache --zero-stats

          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -ffunction-sections -fdata-sections" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--gc-sections -Wl,--as-needed" \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,--gc-sections -Wl,--as-needed"

          cmake --build build --config Release
          sccache --show-stats

      - name: 打包 Release
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          elif [ -n "${GITHUB_REF_NAME}" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="manual"
          fi
          PACKAGE_DIR="${APP_NAME}-${VERSION}-linux-x86_64"
          mkdir -p "${PACKAGE_DIR}"

          find build -maxdepth 3 -type f -name "${APP_NAME}" -exec cp {} "${PACKAGE_DIR}/" \;
          find build -maxdepth 3 -type f -name "libslint*.so*" -exec cp {} "${PACKAGE_DIR}/" \; || true

          strip --strip-unneeded "${PACKAGE_DIR}/${APP_NAME}" || true
          strip --strip-unneeded "${PACKAGE_DIR}"/libslint*.so* || true
          
          chmod +x "${PACKAGE_DIR}/${APP_NAME}"

          ARCHIVE_NAME="${PACKAGE_DIR}.tar.gz"
          GZIP=-9 tar -czvf "${ARCHIVE_NAME}" "${PACKAGE_DIR}"
          
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${VERSION}" >> $GITHUB_ENV

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.ARCHIVE_NAME }}
          draft: false
          prerelease: false
          body: ${{ github.event.head_commit.message }}
