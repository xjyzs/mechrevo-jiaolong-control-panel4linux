name: 编译并发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      APP_NAME: ControlPanel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libx11-dev \
            libgl1-mesa-dev

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 配置 ccache 缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: 缓存 CMake 外部依赖
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-cmake-deps-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-deps-

      - name: 编译
        env:
          CCACHE_DIR: ~/.cache/ccache
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_PANIC: "abort"
          CARGO_PROFILE_RELEASE_STRIP: "true"
        run: |
          ccache -z

          cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
          -DCMAKE_INSTALL_RPATH='$ORIGIN' \
          -DCMAKE_CXX_FLAGS_RELEASE="-O3 -ffunction-sections -fdata-sections" \
          -DCMAKE_EXE_LINKER_FLAGS="-Wl,--gc-sections -Wl,--as-needed" \
          -DCMAKE_SHARED_LINKER_FLAGS="-Wl,--gc-sections -Wl,--as-needed"

          cmake --build build --config Release

      - name: 打包 Release
        run: |
          VERSION=${GITHUB_REF_NAME:-manual}
          PACKAGE_DIR="${APP_NAME}-${VERSION}-linux-x86_64"
          mkdir -p "${PACKAGE_DIR}"

          find build -maxdepth 3 -type f -name "${APP_NAME}" -exec cp {} "${PACKAGE_DIR}/" \;
          find build -maxdepth 3 -type f -name "libslint*.so*" -exec cp {} "${PACKAGE_DIR}/" \; || true

          strip --strip-unneeded "${PACKAGE_DIR}/${APP_NAME}" || true
          strip --strip-unneeded "${PACKAGE_DIR}"/libslint*.so* || true
          
          chmod +x "${PACKAGE_DIR}/${APP_NAME}"

          ARCHIVE_NAME="${PACKAGE_DIR}.tar.gz"
          GZIP=-9 tar -czvf "${ARCHIVE_NAME}" "${PACKAGE_DIR}"
          
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
